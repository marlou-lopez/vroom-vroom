[project]
name = "racecoach"
version = "0.1.0"
description = "AI sim racing engineer: backend (telemetry import, analysis, coach)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "polars>=2.2.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
racecoach = "racecoach.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
